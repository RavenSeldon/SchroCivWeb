# OPTIONAL: add ONLY inside a SEPARATE existing benamuwo.me HTTPS server block.
# Use the static-serving locations in the www.benamuwo.me block.
# First verify www does NOT redirect this path back to the apex (redirect loop).
# Do not add these to a shared apex+www block; leave that block serving both.
# All other apex paths keep their current Flask routing.
location = /schrodingers_civ {
    return 308 https://www.benamuwo.me/schrodingers_civ/$is_args$args;
}
location ^~ /schrodingers_civ/ {
    return 308 https://www.benamuwo.me$request_uri;
}
