# EXAMPLE ONLY. Merge these locations into the EXISTING www.benamuwo.me
# HTTPS server block after inspecting that host's current configuration.
# Static sibling of the existing Flask/Gunicorn upstream.
# Do not replace its server block, certificates, Flask proxy location or upstream.
# No application restart, app import, database or migration command is involved.
# If this block serves both hostnames, these locations serve both; canonical is www.
# Site-specific filesystem: /srv/schrodingers-civ/current/schrodingers_civ/
# Ensure the existing http{} includes the standard mime.types file.

location = /schrodingers_civ {
    return 308 /schrodingers_civ/$is_args$args;
}

location ^~ /schrodingers_civ/ {
    root /srv/schrodingers-civ/current;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /schrodingers_civ/404.html;

    # Revalidate mutable HTML and publication filenames after each release.
    # Inherit a global mime.types mapping; include once here to extend it.
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
