# IndexNow ownership key for benamuwo.me (the canonical host of /schrodingers_civ/)
#
# Add this ONE location inside the existing HTTPS `server { ... }` block that
# serves benamuwo.me. Do not create a new server block. It answers one exact path
# with the key as plain text, and touches no repository, Flask code or
# /schrodingers_civ/ file.
#
# Find the block (on the droplet):
#   grep -ln "server_name[^;]*benamuwo\.me" /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* 2>/dev/null
#
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s https://benamuwo.me/bb04f9030ee793b9013b131113bf5e1c.txt ; echo
#   # must print exactly: bb04f9030ee793b9013b131113bf5e1c
#
# Undo: remove these lines, then `sudo nginx -t && sudo systemctl reload nginx`.

location = /bb04f9030ee793b9013b131113bf5e1c.txt {
    default_type text/plain;
    return 200 "bb04f9030ee793b9013b131113bf5e1c";
}
